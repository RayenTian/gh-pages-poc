name: Deploy static HTML to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages to mint an OIDC token and publish.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `git log -1 -- <file>` prints nothing under a shallow
          # clone, which would silently drop files from the generated index.
          fetch-depth: 0

      - name: Collect static assets into public/
        run: |
          mkdir -p public
          find . \( -name '*.html' -o -name '*.pdf' -o -name '*.png' -o -name '*.jpg' \
                    -o -name '*.jpeg' -o -name '*.gif' -o -name '*.svg' -o -name '*.css' \
                    -o -name '*.js' -o -name '*.json' -o -name '*.csv' \) \
            -not -path './public/*' -not -path './.git/*' -not -path './.github/*' \
          | while read -r f; do
              rel="${f#./}"
              mkdir -p "public/$(dirname "$rel")"
              cp "$f" "public/$rel"
            done

      - name: Generate index.html
        # Newest first, with a per-person filter and fuzzy search over file
        # name + <title>. See .ci/build_index.sh.
        run: sh .ci/build_index.sh public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
